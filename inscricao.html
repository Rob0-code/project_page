<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Página de Inscrição</title>
</head>

<body>

    <h1>Formulário de Inscrição</h1>

    <p>Preencha os dados abaixo para realizar sua inscrição.</p>

    <form id="formInscricao">

        <label for="nome">Nome completo:</label><br>
        <input type="text" id="nome" name="nome" required>

        <br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="telefone">Telefone:</label><br>
        <input type="tel" id="telefone" name="telefone" required>

        <br><br>

        <label for="nascimento">Data de nascimento:</label><br>
        <input type="date" id="nascimento" name="nascimento" required>

        <br><br>

        <label for="curso">Curso:</label><br>
        <select id="curso" name="curso" required>
            <option value="">Selecione</option>
            <option value="computacao">Computação</option>
            <option value="fisica">Física</option>
            <option value="matematica">Matemática</option>
            <option value="engenharia">Engenharia</option>
        </select>

        <br><br>

        <label for="senha">Senha:</label><br>
        <input type="password" id="senha1" name="senha1" minlength="6" required>

        <br><br>
                <label for="senha">Confirme Sua Senha:</label><br>
        <input type="password" id="senha2" name="senha2" minlength="6" required>

        <br><br>

        <input type="checkbox" id="termos" required>
        <label for="termos">Aceito os termos da inscrição.</label>

        <br><br>

        <button type="submit">Inscrever-se</button>

    </form>
<script>
    document.getElementById("formInscricao").addEventListener("submit", function(event) {

        let senha1 = document.getElementById("senha1").value;
        let senha2 = document.getElementById("senha2").value;

        if (senha1 !== senha2) {
            event.preventDefault();
            alert("As senhas não são iguais!");
        }

    });
</script>

    <script>
        document.getElementById("formInscricao").addEventListener("submit", function(event) {
            event.preventDefault();

            alert("Inscrição realizada com sucesso!");
        });
    </script>

</body>

</html>
